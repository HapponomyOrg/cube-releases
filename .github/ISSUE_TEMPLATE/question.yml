# The release workflow of The Cube (release.yml) publishes this file: it
# copies the folder release/repo/ of the source repository to the default
# branch of HapponomyOrg/cube-releases. Change the file there. A change made
# only in cube-releases is lost at the next release.
name: Question
description: Ask a question about The Cube.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [docs](https://happonomyorg.github.io/cube-releases/) may already answer your question.

        - **A security vulnerability** does not go here. Report it privately: see the [security policy](https://github.com/HapponomyOrg/cube-releases/security/policy).
        - Do not paste private content from your knowledge base.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cube --version
      description: The output of `cube --version`, if The Cube is installed.
    validations:
      required: false
  - type: dropdown
    id: system
    attributes:
      label: System
      description: The system that you use or want to use The Cube on.
      multiple: false
      options:
        - "Linux, x86_64"
        - "Linux, arm64"
        - "macOS, Apple silicon"
        - "macOS, Intel"
        - "Windows, x86_64"
        - "Other (say which in your question)"
    validations:
      required: false
